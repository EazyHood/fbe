name: Validate fbe 1785
on:
  push:
    branches: [validate-1785-20261112]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 753d3773973157ca36f105099d43017bd54d613d
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: sudo apt-get update && sudo apt-get install -y parallel
      - name: Run the focused and complete checks
        env:
          RAKE_RUN: 'true'
        run: |
          set -eu
          bundle exec ruby -Itest test/fbe/test_regularly_boundaries.rb -- --no-cov
          bundle exec rake
